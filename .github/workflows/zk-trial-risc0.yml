# The Actions steps of the RISC Zero trial (plan M1.17), on its kept branch only: the host builds,
# executes one vector, then wraps one small vector into a Groth16 proof, the onchain-verifiable
# step, on a GitHub runner. The runner's size, the wrapping's wall time and peak memory, and any
# out-of-memory kill are printed between log markers (plan §1.3).
name: zk-trial-risc0

on:
  push:
    branches: [zk-trial-risc0]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RISC0_RUST: 1.97.0
  RISC0_RUST_TAG: r0.1.97.0
  GROTH16_PROVER_IMAGE: risczero/risc0-groth16-prover:v2025-04-03.1
  SMALL_VECTOR: vectors/game/commit-at-tick-0.json
  # Segments of 2^SEGMENT_PO2 cycles, below RISC Zero's default of 2^20, for a 7.9 GB runner.
  SEGMENT_PO2: "19"

jobs:
  wrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Runner size
        run: |
          echo "=== BEGIN runner ==="
          nproc
          free -m
          df -h /
          docker --version
          echo "=== END runner ==="

      - name: Rust
        run: bash scripts/bootstrap.sh core

      - uses: actions/cache@v6.1.0
        id: risc0-cache
        with:
          path: ~/.risc0
          key: risc0-${{ env.RISC0_RUST_TAG }}

      # rzup queries api.github.com, so the toolchain comes from its release asset and the rzup
      # settings that risc0-build reads are written by hand (docs/TOOLING.md, RISC Zero).
      - name: RISC Zero toolchain (direct asset, docs/TOOLING.md)
        if: steps.risc0-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dir=~/.risc0/toolchains/v"$RISC0_RUST"-rust-x86_64-unknown-linux-gnu
          mkdir -p "$dir"
          curl -sSfL -o /tmp/toolchain.tar.gz \
            "https://github.com/risc0/rust/releases/download/$RISC0_RUST_TAG/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          echo "100b597d605b706bec94e1d32bfaaf5851df8d75173f986d4b56a3e90916be53  /tmp/toolchain.tar.gz" | sha256sum -c -
          tar -xzf /tmp/toolchain.tar.gz --no-same-owner -C "$dir"
          rm /tmp/toolchain.tar.gz
          touch ~/.risc0/.rzup
          printf '[default_versions]\nrust = "%s"\n' "$RISC0_RUST" > ~/.risc0/settings.toml

      - name: Link the RISC Zero toolchain
        run: |
          rustup toolchain link risc0 ~/.risc0/toolchains/v"$RISC0_RUST"-rust-x86_64-unknown-linux-gnu
          rustc +risc0 --version

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            referee/zk -> target

      - name: Build the host
        run: cargo build --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host

      - name: Execute one vector
        run: referee/zk/target/release/zk-host execute "$SMALL_VECTOR"

      - name: Groth16 prover image
        run: |
          docker pull "$GROTH16_PROVER_IMAGE"
          docker image inspect --format '{{.Id}} {{.Size}}' "$GROTH16_PROVER_IMAGE"
          df -h /

      # The sampler prints memory every 10 s, so the log keeps the last reading if the runner dies.
      - name: Groth16 wrapping of one small vector
        run: |
          (while true; do echo "memory $(date -u +%T) $(free -m | awk '/^Mem:/ {printf "used %s MiB, ", $3} /^Swap:/ {printf "swap used %s MiB", $3}')"; sleep 10; done) &
          bash referee/zk/peak-memory.sh referee/zk/target/release/zk-host prove groth16 "$SMALL_VECTOR" "$SEGMENT_PO2"

      - name: Out-of-memory kills
        if: always()
        run: |
          echo "=== BEGIN oom ==="
          sudo dmesg | grep -i -E 'out of memory|oom-kill|killed process' || echo "no OOM kill in dmesg"
          free -m
          echo "=== END oom ==="
