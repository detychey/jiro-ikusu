# The Actions steps of the SP1 trial (plan M1.16), on its kept branch only: the host builds,
# executes one vector, then wraps one small vector into a Groth16 proof, the onchain-verifiable
# step, on a GitHub runner. The runner's size, the wrapping's wall time and peak memory, and any
# out-of-memory kill are printed between log markers (plan §1.3).
name: zk-trial-sp1

on:
  push:
    branches: [zk-trial-sp1]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SP1_VERSION: v6.10.0
  SP1_TOOLCHAIN: succinct-1.96.0-64bit-v3
  SMALL_VECTOR: vectors/game/commit-at-tick-0.json
  # Outside ~/.sp1, so the toolchain cache leaves the circuit artifacts out.
  SP1_GROTH16_CIRCUIT_PATH: /home/runner/sp1-circuits/groth16

jobs:
  wrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Runner size
        run: |
          echo "=== BEGIN runner ==="
          nproc
          free -m
          df -h /
          docker --version
          echo "=== END runner ==="

      # The Groth16 artifacts are a 6.2 GB archive.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Rust
        run: bash scripts/bootstrap.sh core

      - name: protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - uses: actions/cache@v6.1.0
        id: sp1-cache
        with:
          path: ~/.sp1
          key: sp1-${{ env.SP1_VERSION }}-${{ env.SP1_TOOLCHAIN }}

      - name: SP1 (direct assets, docs/TOOLING.md)
        if: steps.sp1-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.sp1/bin ~/.sp1/toolchains/"$SP1_TOOLCHAIN"
          curl -sSfL -o /tmp/cargo_prove.tar.gz \
            "https://github.com/succinctlabs/sp1/releases/download/$SP1_VERSION/cargo_prove_${SP1_VERSION}_linux_amd64.tar.gz"
          echo "10394a834a0ab325b3736a74d0b7087274f2c6a66e2b38f96ecf3e9ecdf9e7b5  /tmp/cargo_prove.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cargo_prove.tar.gz --no-same-owner -C ~/.sp1/bin
          curl -sSfL -o /tmp/toolchain.tar.gz \
            "https://github.com/succinctlabs/rust/releases/download/$SP1_TOOLCHAIN/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          echo "23905647c8ba007bed72e9207ceada06d08023f4dca73c87a122acbe7468ce07  /tmp/toolchain.tar.gz" | sha256sum -c -
          tar -xzf /tmp/toolchain.tar.gz --no-same-owner -C ~/.sp1/toolchains/"$SP1_TOOLCHAIN"
          chmod 755 ~/.sp1/toolchains/"$SP1_TOOLCHAIN"/bin/* ~/.sp1/toolchains/"$SP1_TOOLCHAIN"/lib/rustlib/x86_64-unknown-linux-gnu/bin/*
          rm /tmp/cargo_prove.tar.gz /tmp/toolchain.tar.gz

      - name: Link the SP1 toolchain
        run: |
          rustup toolchain link succinct ~/.sp1/toolchains/"$SP1_TOOLCHAIN"
          ~/.sp1/bin/cargo-prove prove --version
          rustc +succinct --version

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            referee/zk -> target

      - name: Build the host
        run: cargo build --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host

      - name: Execute one vector
        run: referee/zk/target/release/zk-host execute "$SMALL_VECTOR"

      - name: Groth16 circuit artifacts
        run: |
          set -euo pipefail
          dir="$SP1_GROTH16_CIRCUIT_PATH/v6.1.0"
          mkdir -p "$dir"
          curl -sSfL https://sp1-circuits.s3-us-east-2.amazonaws.com/v6.1.0-groth16.tar.gz | tar -xzf - -C "$dir"
          touch "$dir/.complete"
          du -sh "$dir"
          df -h /

      # The sampler prints memory every 10 s, so the log keeps the last reading if the runner dies.
      - name: Groth16 wrapping of one small vector
        run: |
          (while true; do echo "memory $(date -u +%T) $(free -m | awk '/^Mem:/ {printf "used %s MiB, ", $3} /^Swap:/ {printf "swap used %s MiB", $3}')"; sleep 10; done) &
          bash referee/zk/peak-memory.sh referee/zk/target/release/zk-host prove groth16 "$SMALL_VECTOR"

      - name: Out-of-memory kills
        if: always()
        run: |
          echo "=== BEGIN oom ==="
          sudo dmesg | grep -i -E 'out of memory|oom-kill|killed process' || echo "no OOM kill in dmesg"
          free -m
          echo "=== END oom ==="
