# Private CI profile (plan §1.3, P14): the rust, rust-release, targets, determinism,
# vectors-drift, levels-drift, wasm-parity, difffuzz and stylus rows of plan §3.4 run as step
# groups of one `rust` job; vectors-drift also runs the version gate,
# scripts/check-rules-version.sh. The stylus row generates M1.10's 200 fixed difffuzz cases
# before the tests, whose TestVM replay of jiro-referee-stylus needs them, and size-gates the
# Stylus wasm after them; the difffuzz row replays the same cases through jiro-wasm, and the
# zk-exec job runs 20 of them through the executor (plan M1.13). The job always
# starts and reports a status; its steps skip when no path of the `rust` filter changed (Rust
# sources, scripts, tools/xcheck, vectors, levels, the playtest reports that levels/README.md
# reads, the wasm builds and the wasm runner, this workflow), except on workflow_dispatch, where every step runs. Once the toolchain is
# installed, every check runs even after another check failed, so one run reports every
# failure.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # check-rules-version.sh compares with the merge base of origin/main.
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/.cargo/**'
              - 'rust-toolchain.toml'
              - 'scripts/**'
              - 'tools/xcheck/**'
              - 'vectors/**'
              - 'levels/**'
              - 'reports/playtest-*.json'
              - 'web/wasm/**'
              - 'web/test/vectors.mjs'
              - 'web/src/vectors.mjs'
              - 'web/test/difffuzz.mjs'
              - 'web/test/wasm.mjs'
              - 'web/package-lock.json'
              - 'referee/**'
              - '.github/workflows/ci.yml'
            rules:
              - 'README.md'
              - 'scripts/check-rule-tags.sh'

      - name: Runner size
        run: |
          nproc
          free -g

      - name: Rule tags (determinism)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.rust == 'true' || steps.changes.outputs.rules == 'true'
        run: bash scripts/check-rule-tags.sh

      - name: Toolchain
        id: toolchain
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.changes.outputs.rust == 'true') }}
        run: bash scripts/bootstrap.sh core

      - name: Toolchain equals rust-toolchain.toml
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          actual="$(rustc --version)"
          echo "$actual"
          case "$actual" in
            "rustc $expected "*) ;;
            *) echo "::error::rustc is '$actual', rust-toolchain.toml pins $expected"; exit 1 ;;
          esac

      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        with:
          workspaces: |
            . -> target
            scripts/float-probe -> target

      - name: Format (rust)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          status=0
          cargo fmt --all --check || status=1
          cargo fmt --manifest-path scripts/float-probe/Cargo.toml --check || status=1
          exit "$status"

      - name: Clippy (rust)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: The 200 fixed difffuzz cases, for the referee's TestVM replay (stylus)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo run -p jiro-tools --release --locked -- difffuzz --seed 1 --cases 200 --out target/difffuzz

      - name: Tests, debug (rust)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --workspace --locked

      - name: Tests, release (rust-release)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --workspace --release --locked

      - name: jiro-core on three targets (targets)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          for target in wasm32-unknown-unknown riscv32im-unknown-none-elf riscv64imac-unknown-none-elf; do
            cargo build -p jiro-core --release --locked --target "$target"
          done

      - name: jiro-core on its MSRV (targets)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("core/Cargo.toml", "rb"))["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          cargo "+$msrv" build -p jiro-core --release --locked

      - name: No floats, no usize, overflow checks everywhere (determinism)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          mkdir -p target/determinism
          status=0
          for check in check-no-float check-no-usize check-profiles; do
            bash "scripts/$check.sh" 2>&1 | tee -a target/determinism/report.txt || status=1
          done
          exit "$status"

      - uses: actions/setup-node@v7.1.0
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/xcheck/package-lock.json
            web/package-lock.json

      - name: Vectors match their generators (vectors-drift)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix tools/xcheck ci
          node tools/xcheck/derivations.mjs --write
          cargo run -p jiro-tools --locked -- vectors
          bash scripts/check-drift.sh vectors/
          bash scripts/check-rules-version.sh

      - name: Levels match their sources (levels-drift)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          cargo run -p jiro-tools --locked -- level build levels/src levels
          bash scripts/check-drift.sh levels/
          cargo run -q -p jiro-tools --locked -- level validate levels/src/*.txt levels/*.bin
          for bin in levels/*.bin; do
            cargo run -q -p jiro-tools --locked -- level render "$bin" |
              diff - "levels/src/$(basename "$bin" .bin).txt"
          done

      - name: jiro-wasm replays every vector under Node (wasm-parity)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          bash web/wasm/build-wasm.sh
          node web/test/vectors.mjs vectors/

      - name: jiro-wasm agrees with native on the 200 fixed difffuzz cases (difffuzz)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix web ci
          node web/test/difffuzz.mjs target/difffuzz

      - name: The Stylus referee fits the contract size limit (stylus)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash referee/build-wasm.sh

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        with:
          name: determinism-report
          path: target/determinism/report.txt
          retention-days: 7
          if-no-files-found: error

      - name: The checks left the tree clean
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/check-drift.sh .

  # The web row of plan §3.4: the browser shell, on the wasm build of the core, and the chain
  # bindings that web/scripts/bindings.mjs generates from contracts/abi/, which must not drift
  # (plan M5.1). The brand assets in web/public/ must match their sources in brand/src/
  # (brand/README.md). The production build must carry neither of the pages built only for
  # pull-request previews, vectors and probe, nor any file of vectors/ (plan M3.12). Then the
  # Challenge run flow runs end to end on a local chain left up by `localnet.mjs --up`, which
  # needs Foundry and the contracts' submodules, with the playtest bots of jiro-tools choosing
  # the inputs: a run, a reload in the third level, reloads right after a
  # level ends by lives out and by a clear, a reload while startRun confirms, and a stale season,
  # last as it opens a new one (plan M5.2). Its steps skip when no path of the `web` filter changed, except on workflow_dispatch.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # forge-std and OpenZeppelin, pinned as submodules under contracts/lib, for the local chain.
          submodules: true

      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - 'brand/**'
              - 'contracts/**'
              - 'scripts/contracts/**'
              - '.gitmodules'
              - 'deployments/**'
              - 'levels/**'
              - 'seasons/**'
              - 'core/**'
              - 'shell/**'
              - 'tools/**'
              - 'vectors/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - name: Toolchain
        id: toolchain
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true' }}
        run: bash scripts/bootstrap.sh core

      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ steps.toolchain.outcome == 'success' }}

      - name: jiro-wasm
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: bash web/wasm/build-wasm.sh

      - uses: actions/setup-node@v7.1.0
        if: ${{ steps.toolchain.outcome == 'success' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/contracts/package-lock.json

      - name: Brand assets are up to date (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: node brand/build.mjs --check

      - name: The chain bindings match contracts/abi/ (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix web ci
          node web/scripts/bindings.mjs
          bash scripts/check-drift.sh web/src/chain/bindings/

      - name: Browser shell builds and passes its tests (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build

      - name: The production build has no preview page and no vector file (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          named="$(find web/dist \( -name 'vectors*' -o -name 'probe*' \) -print)"
          # A file of the build with the content of a vector file, whatever its name.
          copied="$(find web/dist -type f -size +0 -exec sha256sum {} + |
            awk 'NR == FNR { vector[$1] = 1; next } $1 in vector { print $2 }' \
              <(sha256sum vectors/format/* vectors/game/* vectors/levels/*) -)"
          if [ -n "$named$copied" ]; then
            echo "::error::the production build carries preview files:"
            echo "$named"
            echo "$copied"
            exit 1
          fi

      - name: Native replay of the browser's scripted journal gives its end-screen hash (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          cargo run -p jiro-tools --locked -- replay --vector vectors/game/open-field-empty.json \
            --journal web/test/out/scripted.jrn | tee target/scripted-replay.txt
          grep -qF "$(cat web/test/out/scripted.hash)" target/scripted-replay.txt

      - uses: foundry-rs/foundry-toolchain@v1.9.2
        if: ${{ steps.toolchain.outcome == 'success' }}
        with:
          version: v1.8.6
          # Its cache holds RPC responses for fork tests, which this job has none of.
          cache: false

      - name: A Challenge run from purchase to commit on a local chain, with reloads (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          cargo build -p jiro-tools --locked
          npm --prefix scripts/contracts ci
          node scripts/contracts/localnet.mjs --up
          for case in "" "--reload-at 3" "--reload-after-end out-of-lives" "--reload-after-end cleared" "--reload-during-buy" "--stale-season"; do
            echo "=== BEGIN challenge-e2e ${case:-run} ==="
            # $case is a flag and its value, split on purpose.
            # shellcheck disable=SC2086
            timeout 300 node web/scripts/challenge-e2e.mjs --rpc http://127.0.0.1:8545 $case ||
              { status=$?; tail -n 40 /tmp/jiro-localnet-anvil-8545.log; exit "$status"; }
            echo "=== END challenge-e2e ${case:-run} ==="
          done
          rm deployments/local.json

      - name: The operator settles a season's best runs from chain data, on a local chain (web)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          node scripts/contracts/localnet.mjs --up --backend zk --port 8546
          timeout 300 node web/scripts/challenge-e2e.mjs --rpc http://127.0.0.1:8546 --players 2 --settle --backend zk ||
            { status=$?; tail -n 40 /tmp/jiro-localnet-anvil-8546.log; exit "$status"; }
          rm deployments/local.json

      - name: The checks left the tree clean
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/check-drift.sh .

  # The contracts row of plan §3.4: forge builds the contracts and runs their tests, then
  # scripts/contracts/abi.sh regenerates contracts/abi/, which must not drift. The contract
  # scripts' tests run, and `localnet.mjs --check` runs a Challenge run's happy path on anvil,
  # which foundry-toolchain installs (plan M4.11). Then the web app's chain module calls
  # startRun on a local chain left up by `localnet.mjs --up` (plan M5.1). Its steps skip when no
  # path of the `contracts` filter changed, except on workflow_dispatch.
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # forge-std, OpenZeppelin and risc0-ethereum, pinned as submodules under contracts/lib.
          submodules: true

      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/contracts/**'
              - 'scripts/check-drift.sh'
              - 'vectors/derivations.json'
              - 'vectors/game/**'
              - 'vectors/levels/**'
              - 'seasons/calibration-1.json'
              - 'web/src/chain/**'
              - 'web/scripts/chain-smoke.mjs'
              - 'web/package-lock.json'
              - '.gitmodules'
              - '.github/workflows/ci.yml'

      - uses: foundry-rs/foundry-toolchain@v1.9.2
        id: toolchain
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.contracts == 'true' }}
        with:
          version: v1.8.6
          # Its cache holds RPC responses for fork tests, which this job has none of.
          cache: false

      - name: Contracts build and pass their tests (contracts)
        if: ${{ steps.toolchain.outcome == 'success' }}
        working-directory: contracts
        run: |
          forge --version
          forge build
          forge test -vv

      - name: ABIs match the contracts (contracts)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          bash scripts/contracts/abi.sh
          bash scripts/check-drift.sh contracts/abi/

      - uses: actions/setup-node@v7.1.0
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scripts/contracts/package-lock.json
            web/package-lock.json

      - name: Contract scripts pass their tests, and the local chain settles a run (contracts)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix scripts/contracts ci
          node --test scripts/contracts/*.test.mjs
          node scripts/contracts/localnet.mjs --check

      - name: The web app's chain module starts a run on the local chain (contracts)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          npm --prefix web ci
          node scripts/contracts/localnet.mjs --up
          node web/scripts/chain-smoke.mjs --rpc http://127.0.0.1:8545

      - name: The checks left the tree clean
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/check-drift.sh .

  # The zk-exec row of plan §3.4 (M1.12): the zk referee of referee/zk/, RISC Zero's guests run in
  # its executor on the CPU. The format vectors and 4 game vectors must give the native core's
  # recorded codes, Outcomes and trace digests, and a dev-mode receipt of the verify guest must
  # round-trip to its vector's Outcome, and the first 20 of M1.10's 200 fixed difffuzz cases must
  # give native's Outcomes and trace digests (plan M1.13); a debug build of jiro-tools writes them,
  # in seconds. nightly.yml runs every vector. It is its own job, not a
  # step group of `rust`, so that its build cache and its time limit are its own: a cold build of
  # the host takes about 63 minutes on this runner, almost all of it g++ on RISC Zero's circuit
  # kernels, and a warm one minutes (docs/TOOLING.md, Actions minutes). On an exact cache hit the
  # build gets 20 minutes; on a miss, which happens once per change of referee/zk's lockfiles or
  # toolchain, and the first time a branch has no cache to restore, it gets 80, and that run seeds
  # the cache. Its steps skip when no path of the `zk` filter changed, except on
  # workflow_dispatch; the filter includes the jiro-tools sources that write the difffuzz cases.
  zk-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    defaults:
      run:
        shell: bash
    env:
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            zk:
              - 'Cargo.toml'
              - 'core/**'
              - 'referee/zk/**'
              - 'vectors/**'
              - 'tools/Cargo.toml'
              - 'tools/src/difffuzz.rs'
              - 'tools/src/cases.rs'
              - 'tools/src/random.rs'
              - 'tools/src/vectors.rs'
              - 'tools/src/json.rs'
              - 'scripts/bootstrap.sh'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - uses: actions/cache@v6.1.0
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.zk == 'true' }}
        with:
          path: ~/.risc0
          key: risc0-r0.1.97.0

      - name: Toolchains
        id: toolchain
        if: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.zk == 'true' }}
        run: bash scripts/bootstrap.sh zk

      - uses: Swatinem/rust-cache@v2.9.3
        id: cache
        if: ${{ steps.toolchain.outcome == 'success' }}
        with:
          shared-key: zk-exec
          workspaces: |
            referee/zk -> target

      - name: Format (zk-exec)
        if: ${{ steps.toolchain.outcome == 'success' }}
        run: |
          status=0
          cargo fmt --manifest-path referee/zk/Cargo.toml --check || status=1
          cargo fmt --manifest-path referee/zk/guest/Cargo.toml --check || status=1
          exit "$status"

      - name: Build the guests and the host
        if: ${{ steps.toolchain.outcome == 'success' }}
        timeout-minutes: ${{ steps.cache.outputs.cache-hit == 'true' && 20 || 80 }}
        run: |
          echo "cache hit: ${{ steps.cache.outputs.cache-hit }}"
          cargo build --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host

      - name: The format vectors and 4 game vectors through the executor (zk-exec)
        if: ${{ steps.toolchain.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          referee/zk/target/release/zk-host execute vectors/format \
            vectors/game/full-journal.json vectors/game/open-field-capture.json \
            vectors/game/rejected-level-id.json vectors/game/worst-case.json

      - name: 20 of the fixed difffuzz cases through the executor (difffuzz)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          cargo run -p jiro-tools --locked -- difffuzz --seed 1 --cases 20 --out target/difffuzz
          referee/zk/target/release/zk-host difffuzz target/difffuzz

      - name: A dev-mode receipt round-trips (zk-exec)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 20
        run: cargo test --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host --test mock_round_trip

      - name: The checks left the tree clean
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/check-drift.sh .
