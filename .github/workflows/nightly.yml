# Heavy runs (plan §1.3, §3.4; M1.10), private CI profile: when the `ci:heavy` label is added to
# a PR, on workflow_dispatch, and weekly on schedule. A PR run checks 2,000 cases per property, a
# dispatch the count it is given, and the scheduled run the full counts: 100,000 cases per
# property, the arbitrary inputs through replay among them, the 100,000-board minion coverage
# run, and the playtest, the levels build and `calibrate --check`, whose playtest report, levels
# table, calibration file, calibration report and gate set must match the committed ones (plan
# M2.6, M2.9). Every run also puts every vector through the zk referee's executor, in its own job
# that shares ci.yml's zk-exec build cache (plan M1.12). A scheduled run skips its work when main
# has no commit since the previous scheduled run.
# Once the toolchain is installed, every check runs even after another check failed. Never a
# required check.
name: nightly

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per property
        required: true
        default: '2000'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  heavy:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:heavy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      run: ${{ steps.work.outputs.run }}
    defaults:
      run:
        shell: bash
    env:
      CASES: ${{ github.event_name == 'schedule' && '100000' || inputs.cases || '2000' }}
    steps:
      - name: Work to do
        id: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$CASES" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::cases: a positive whole number, got '$CASES'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml \
              --event schedule --branch main --status completed --limit 1 \
              --json headSha --jq '.[0].headSha // ""')"
            if [ "$previous" = "$GITHUB_SHA" ]; then
              echo "main has no commit since the previous scheduled run, at $previous"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: ${{ steps.work.outputs.run == 'true' }}
        with:
          persist-credentials: false

      - name: Toolchain
        id: toolchain
        if: ${{ steps.work.outputs.run == 'true' }}
        run: bash scripts/bootstrap.sh core

      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ steps.toolchain.outcome == 'success' }}

      - name: Properties, CASES per property
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          echo "=== BEGIN properties ==="
          status=0
          JIRO_CASES="$CASES" cargo test -p jiro-core --release --locked --test properties || status=1
          echo "=== END properties ==="
          exit "$status"

      - name: difffuzz, the fixed set
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo run -p jiro-tools --release --locked -- difffuzz --seed 1 --cases 200 --out target/difffuzz

      - name: Minion coverage on 100,000 boards
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && github.event_name == 'schedule' }}
        run: |
          echo "=== BEGIN minion-coverage ==="
          status=0
          cargo test -p jiro-core --release --locked --test minion_coverage -- --include-ignored --nocapture || status=1
          echo "=== END minion-coverage ==="
          exit "$status"

      - name: Calibration and gate set match their generator (calibrate)
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && github.event_name == 'schedule' }}
        run: |
          echo "=== BEGIN calibrate ==="
          status=0
          cargo run -p jiro-tools --release --locked -- playtest --levels levels --check levels/targets.json || status=1
          cargo run -p jiro-tools --locked -- level build levels/src levels || status=1
          cargo run -p jiro-tools --release --locked -- calibrate --check --out seasons/calibration-1.json || status=1
          bash scripts/check-drift.sh seasons/ levels/ vectors/ reports/ || status=1
          echo "=== END calibrate ==="
          exit "$status"

  # The full set of the zk-exec row (plan §3.4, M1.12): every vector under vectors/ through the zk
  # referee's guests, as ci.yml's zk-exec job runs a subset. It runs once `heavy` has decided there
  # is work, even if a check of `heavy` failed. It restores ci.yml's zk-exec cache, so a cold build
  # (about 63 minutes) happens only when that cache is missing (ci.yml, zk-exec).
  zk-exec:
    needs: heavy
    if: ${{ !cancelled() && needs.heavy.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    defaults:
      run:
        shell: bash
    env:
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.risc0
          key: risc0-r0.1.97.0

      - name: Toolchains
        run: bash scripts/bootstrap.sh zk

      - uses: Swatinem/rust-cache@v2.9.3
        id: cache
        with:
          shared-key: zk-exec
          workspaces: |
            referee/zk -> target

      - name: Build the guests and the host
        timeout-minutes: ${{ steps.cache.outputs.cache-hit == 'true' && 20 || 80 }}
        run: |
          echo "cache hit: ${{ steps.cache.outputs.cache-hit }}"
          cargo build --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host

      - name: Every vector through the executor
        timeout-minutes: 30
        run: referee/zk/target/release/zk-host execute vectors/
