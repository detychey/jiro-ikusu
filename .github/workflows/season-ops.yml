# Season operations on Arbitrum Sepolia (plan M5.8, M5.5), public CI profile (plan §1.3, P14).
# Daily and on workflow_dispatch: season.mjs status of every season of
# deployments/arbitrum-sepolia.json, failing when a Season is not solvent, then close and withdraw,
# which send nothing until a season's end plus grace has passed (README §8.4), then one bot run of
# the tester in BOT_SEASON, from the day its open is recorded in deployments/ to its end
# (docs/SEASON_RUNBOOK.md). They sign with TESTER_KEY: anyone may close, withdraw and play, so the
# operator's key never reaches Actions. Nothing here proves a run: a whole run takes hours on a CPU
# (docs/DEPLOYMENT.md), and the operator settles from its own machine (web/scripts/settle.mjs). On
# PRs that touch season.mjs or this file: the read-only status, with no secret. A run that may send
# transactions is never cancelled. Never a required check.
name: season-ops

on:
  schedule:
    - cron: '17 7 * * *'
  pull_request:
    paths:
      - 'scripts/contracts/season.mjs'
      - '.github/workflows/season-ops.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  season-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BOT_SEASON: testnet-1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json

      - name: Install the contract scripts
        run: npm --prefix scripts/contracts ci

      - name: Season status and solvency
        run: |
          echo "=== BEGIN season-status ==="
          node scripts/contracts/season.mjs status --network arbitrum-sepolia
          echo "=== END season-status ==="

      - name: Close the seasons and withdraw the rake that are due
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TESTER_KEY: ${{ secrets.TESTER_KEY }}
        run: |
          node scripts/contracts/season.mjs close --network arbitrum-sepolia
          node scripts/contracts/season.mjs withdraw --network arbitrum-sepolia

      - name: Whether the bots' season is recorded on the newest generation
        id: bots
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          season="$(node -p "require('./deployments/arbitrum-sepolia.json').generations[0].seasons[process.env.BOT_SEASON] ?? ''")"
          echo "season=$season" >> "$GITHUB_OUTPUT"
          [ -n "$season" ] || echo "$BOT_SEASON is not recorded on the newest generation: no bot run"

      - name: Toolchain, for the bots
        if: ${{ steps.bots.outputs.season != '' }}
        run: bash scripts/bootstrap.sh core

      - uses: Swatinem/rust-cache@v2.9.3
        if: ${{ steps.bots.outputs.season != '' }}

      # Without the key: build scripts run as children of cargo.
      - name: Build jiro-tools, for the bots
        if: ${{ steps.bots.outputs.season != '' }}
        run: cargo build -p jiro-tools --release --locked

      - name: The tester's bot run in the bots' season, which plays nothing after its end
        if: ${{ steps.bots.outputs.season != '' }}
        env:
          TESTER_KEY: ${{ secrets.TESTER_KEY }}
        run: node scripts/contracts/season.mjs bots --network arbitrum-sepolia --season "$BOT_SEASON" --runs 1
