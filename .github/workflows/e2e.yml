# The end-to-end suite of Challenge runs on nitro-devnode (plan M4.16, README §7.2), private CI
# profile (plan §1.3, P14): when the `ci:heavy` label is added to a PR, and on workflow_dispatch.
# In the public profile it would run on PRs that touch contracts/, scripts/contracts/, referee/
# or this file. It starts nitro-devnode with the vendored script of M4.2, and e2e.mjs deploys a
# fresh generation with the real Stylus referee through cargo-stylus, with nitro-devnode's public
# prefunded development key, which is not a secret. The six cases then call the referee's
# verifyRun and verify for real, and the gas of every transaction goes between
# `=== BEGIN e2e-gas ===` and `=== END e2e-gas ===`. The e2e-zk job runs the same cases in the zk
# mode (plan M4.10) on anvil: ZkReferee over RISC Zero's mock verifier, settled with the dev-mode
# proofs of the zk host, built with ci.yml's zk-exec cache. Never a required check.
name: e2e

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:heavy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RPC: http://127.0.0.1:8547
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # forge-std and OpenZeppelin, pinned as submodules under contracts/lib.
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
          cache: false

      # The image pull overlaps the builds below; the suite step waits for the node.
      - name: Start nitro-devnode
        working-directory: scripts/contracts/nitro
        run: |
          cast --version
          nohup bash run-dev-node.sh > "$RUNNER_TEMP/devnode.log" 2>&1 &
          echo "DEVNODE_PID=$!" >> "$GITHUB_ENV"

      - name: Toolchain
        run: bash scripts/bootstrap.sh core

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: actions/cache@v6.1.0
        id: cargo-stylus
        with:
          path: ~/.cargo/bin/cargo-stylus
          key: cargo-stylus-0.10.10-${{ runner.os }}-rust-1.98.0

      - name: cargo-stylus 0.10.10
        if: ${{ steps.cargo-stylus.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-stylus --version 0.10.10

      - name: Build jiro-tools and the referee
        run: |
          cargo build -p jiro-tools --release --locked
          bash referee/build-wasm.sh

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json

      - name: End-to-end suite (e2e.mjs)
        run: |
          for _ in $(seq 1 600); do
            grep -q 'press Ctrl-C to stop' "$RUNNER_TEMP/devnode.log" && break
            kill -0 "$DEVNODE_PID" 2>/dev/null || break
            sleep 1
          done
          if ! grep -q 'press Ctrl-C to stop' "$RUNNER_TEMP/devnode.log"; then
            tail -n 100 "$RUNNER_TEMP/devnode.log"
            echo "::error::nitro-devnode did not become ready"
            exit 1
          fi
          docker image inspect --format '{{index .RepoDigests 0}}' "$(docker inspect --format '{{.Config.Image}}' nitro-dev)"
          npm --prefix scripts/contracts ci
          DEPLOYER_KEY="$(sed -n 's/^PRIVATE_KEY=//p' scripts/contracts/nitro/run-dev-node.sh)" \
            node scripts/contracts/e2e.mjs --network nitro-devnode --rpc "$RPC"

  e2e-zk:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:heavy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      RISC0_BUILD_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1.9.2
        with:
          version: v1.8.6
          cache: false

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.risc0
          key: risc0-r0.1.97.0

      - name: Toolchains
        run: bash scripts/bootstrap.sh zk

      - uses: Swatinem/rust-cache@v2.9.3
        id: cache
        with:
          shared-key: zk-exec
          save-if: false
          workspaces: |
            referee/zk -> target

      - name: Build jiro-tools, the guests and the host
        timeout-minutes: ${{ steps.cache.outputs.cache-hit == 'true' && 20 || 80 }}
        run: |
          echo "cache hit: ${{ steps.cache.outputs.cache-hit }}"
          cargo build -p jiro-tools --release --locked
          cargo build --release --locked --manifest-path referee/zk/Cargo.toml -p zk-host

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/contracts/package-lock.json

      - name: End-to-end suite, zk mode (e2e.mjs --zk)
        run: |
          npm --prefix scripts/contracts ci
          node scripts/contracts/e2e.mjs --network local --zk
