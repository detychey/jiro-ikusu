[profile.default]
solc_version = "0.8.28"
# ethblockdigger's evmVersion, from its scripts/contracts/compile.ts, with its optimizer settings.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Only these remappings, whether or not OpenZeppelin's own submodules are checked out.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
