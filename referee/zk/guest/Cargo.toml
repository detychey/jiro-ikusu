[workspace]

[package]
name = "zk-guest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jiro-core = { path = "../../../core" }
sp1-zkvm = "=6.10.0"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.stylus]
inherits = "release"
opt-level = "z"
